.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Indirect support and torsion in an edge beam</title><desc>Left: section through an edge beam. The slab reaction 8.25 kN/m acts 0.15 m from the beam centreline, a torque of 1.24 kN m per metre; a canopy hung from the beam adds 6 kN/m at 1.15 m, 6.9 kN m per metre. Right: torque along a 9 m span fixed against twist at both ends, from plus T to minus T, T = tL/2.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="410" fill="#FFFFFF"/><text class="tt" x="20.0" y="30.0" text-anchor="start">Section through the edge beam</text>
