.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Equilibrium and determinacy of single beams</title><desc>Panel a: a 6 m beam on a pin and a roller with a 50 kN load inclined 30 degrees, 2 m from A; reactions Ax 43.3 kN, Ay 16.67 kN, By 8.33 kN. Panel b: a propped cantilever with four reactions, indeterminate to degree one. Panel c: a beam on three rollers, three parallel reactions, unstable sideways.</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m993C1D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="26.0" text-anchor="start">a.  Pin + roller: r = 3, determinate</text>
<rect x="160.0" y="120.0" width="310.0" height="10.0" rx="1" stroke-width="0.6" class="c-purple"/>
<line x1="211.3" y1="90.0" x2="261.3" y2="119.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="205.3" y="84.0" text-anchor="end">P = 50 kN at 30°</text>
<polygon points="160.0,130.0 148.0,150.0 172.0,150.0" stroke-width="1" fill="none" stroke="#73726c"/>
<line x1="140.0" y1="154.0" x2="180.0" y2="154.0" stroke="#73726c" stroke-width="1" stroke-linecap="butt"/>
