.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Reading plate results: peak against strip average</title><desc>Simply supported square plate 7.5 m, 13.3 kN/m², Poisson ratio 0.2 (Navier series). Bending moment mx across the width at midspan: peak 33.07 kN·m/m at the centre, average 21.70 over the full width and 30.14 over the middle half. Designing the full width for the peak adds 52%. The integral is 23% of a one-way slab: load near each edge goes to that edge, and twisting carries much of the rest.</desc><defs></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">mx across the width at midspan (kN·m per m)</text>
