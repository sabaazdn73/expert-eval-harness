<text class="ts" x="472.0" y="220.0" text-anchor="start">Real worst for lift-off:</text>
<text class="ts" x="472.0" y="237.0" text-anchor="start">  0.9D − Ev + E (1,050, 270)</text>
<text class="ts" x="472.0" y="254.0" text-anchor="start">  e = 0.257 m, qmin 56.7</text>
<text class="ts" x="472.0" y="271.0" text-anchor="start">Real worst for bearing:</text>
<text class="ts" x="472.0" y="288.0" text-anchor="start">  1.2D + 1.6L, qmax 342.2</text>
<text class="ts" x="472.0" y="305.0" text-anchor="start"></text>
<text class="ts" x="472.0" y="322.0" text-anchor="start">Check each combination with</text>
