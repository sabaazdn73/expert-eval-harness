.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Pile loads under a four-pile cap</title><desc>Plan of a four-pile cap with piles at plus and minus 0.9 m. Axial load 3000 kN, moment 450 kN m about the y axis and 270 kN m about the x axis. Pile loads 950, 800, 700 and 550 kN.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/><rect x="70.0" y="80.0" width="260.0" height="260.0" rx="0" stroke-width="1" class="c-gray" opacity="0.7"/>
<line x1="40.0" y1="210.0" x2="360.0" y2="210.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="200.0" y1="50.0" x2="200.0" y2="370.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" stroke-dasharray="5 4"/>
<text class="ts" x="364.0" y="214.0" text-anchor="start">x</text>
<text class="ts" x="204.0" y="46.0" text-anchor="start">y</text>
<circle cx="280.0" cy="130.0" r="24" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text class="th" x="280.0" y="135.0" text-anchor="middle">950</text>
<circle cx="280.0" cy="290.0" r="24" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text class="th" x="280.0" y="295.0" text-anchor="middle">800</text>
<circle cx="120.0" cy="130.0" r="24" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text class="th" x="120.0" y="135.0" text-anchor="middle">700</text>
<circle cx="120.0" cy="290.0" r="24" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text class="th" x="120.0" y="295.0" text-anchor="middle">550</text>
<rect x="182.0" y="192.0" width="36.0" height="36.0" rx="0" stroke-width="0" fill="#5F5E5A"/>
<text class="tl" x="200.0" y="256.0" text-anchor="middle">P = 3000 kN</text>
<line x1="122.0" y1="360.0" x2="198.0" y2="360.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="120.0" y1="355.0" x2="120.0" y2="365.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="200.0" y1="355.0" x2="200.0" y2="365.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="160.0" y="355.0" text-anchor="middle">0.9 m</text>
<line x1="202.0" y1="360.0" x2="278.0" y2="360.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="200.0" y1="355.0" x2="200.0" y2="365.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="280.0" y1="355.0" x2="280.0" y2="365.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="240.0" y="355.0" text-anchor="middle">0.9 m</text>
<rect x="390.0" y="40.0" width="275.0" height="250.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="402.0" y="64.0" text-anchor="start">Rigid cap, equal piles:</text>
<text class="ts" x="402.0" y="81.0" text-anchor="start">Pi = P/n ± My·xi/Σx² ± Mx·yi/Σy²</text>
<text class="ts" x="402.0" y="98.0" text-anchor="start"></text>
<text class="ts" x="402.0" y="115.0" text-anchor="start">P/n = 3000 / 4 = 750 kN</text>
<text class="ts" x="402.0" y="132.0" text-anchor="start">Σx² = Σy² = 4 × 0.9² = 3.24 m²</text>
<text class="ts" x="402.0" y="149.0" text-anchor="start">My = 450: ± 450 × 0.9 / 3.24 = ±125</text>
<text class="ts" x="402.0" y="166.0" text-anchor="start">Mx = 270: ± 270 × 0.9 / 3.24 = ±75</text>
<text class="ts" x="402.0" y="183.0" text-anchor="start"></text>
<text class="ts" x="402.0" y="200.0" text-anchor="start">Piles: 950, 800, 700, 550 kN</text>
<text class="ts" x="402.0" y="217.0" text-anchor="start">Sum = 3000 kN ✓</text>
<text class="ts" x="402.0" y="234.0" text-anchor="start"></text>
<text class="ts" x="402.0" y="251.0" text-anchor="start">P includes the cap weight.</text>
<rect x="390.0" y="306.0" width="275.0" height="82.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="402.0" y="328.0" text-anchor="start">Tension check: P = 1000, M = 1500:</text>
<text class="ts" x="402.0" y="346.0" text-anchor="start">250 ± 1500 × 0.9 / 3.24 = 250 ± 416.7</text>
<text class="ts" x="402.0" y="364.0" text-anchor="start">one row at −166.7 kN (tension pile)</text></svg>