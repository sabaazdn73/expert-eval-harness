<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><style>text{font-family:"DejaVu Sans",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.tl{font-size:12px;fill:#2C2C2A}.tt{font-size:15px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-coral{fill:#FAECE7;stroke:#993C1D}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Diaphragm opening and re-entrant corner</title><desc>Left: a 24 by 12 m diaphragm with a 6 by 4 m opening at mid-depth from x = 6 to 12 m. Shear at the opening centre is 75 kN, 37.5 kN in each 4 m strip, giving a secondary chord force of about 28.1 kN at the opening corners. Right: an L-shaped plan where a drag strut continues the main block chord across the re-entrant corner.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><text class="tt" x="20.0" y="40.0" text-anchor="start">Opening in the diaphragm</text>
<rect x="30.0" y="90.0" width="288.0" height="144.0" rx="0" stroke-width="0.6" class="c-gray" opacity="0.6"/>
<rect x="102.0" y="138.0" width="72.0" height="48.0" rx="0" stroke-width="1" class="c-white" stroke-dasharray="4 3"/>
<line x1="48.0" y1="138.0" x2="228.0" y2="138.0" stroke="#993C1D" stroke-width="2.5" stroke-linecap="butt"/>
<line x1="48.0" y1="186.0" x2="228.0" y2="186.0" stroke="#993C1D" stroke-width="2.5" stroke-linecap="butt"/>
<text class="tl" x="138.0" y="166.0" text-anchor="middle">opening</text>
<line x1="30.0" y1="264.0" x2="30.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="66.0" y1="264.0" x2="66.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="102.0" y1="264.0" x2="102.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="138.0" y1="264.0" x2="138.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="174.0" y1="264.0" x2="174.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="210.0" y1="264.0" x2="210.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="246.0" y1="264.0" x2="246.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="282.0" y1="264.0" x2="282.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="318.0" y1="264.0" x2="318.0" y2="237.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<rect x="20.0" y="280.0" width="300.0" height="130.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="32.0" y="302.0" text-anchor="start">At x = 9 m: V = 300 − 25 × 9 = 75 kN</text>
<text class="ts" x="32.0" y="319.0" text-anchor="start">Each 4 m strip carries 37.5 kN</text>
<text class="ts" x="32.0" y="336.0" text-anchor="start">Opening-edge chords (red): 37.5 × 3 / 4</text>
<text class="ts" x="32.0" y="353.0" text-anchor="start">= 28.1 kN, run on 28.1 / 6.25 = 4.5 m</text>
<text class="ts" x="32.0" y="370.0" text-anchor="start">past the corners. Outer chords:</text>
<text class="ts" x="32.0" y="387.0" text-anchor="start">140.6 ± 28.1 kN near the opening.</text>
<text class="tt" x="370.0" y="40.0" text-anchor="start">Re-entrant corner</text>
<polygon points="400.0,70.0 640.0,70.0 640.0,170.0 500.0,170.0 500.0,270.0 400.0,270.0" stroke-width="0.8" class="c-gray"/>
<line x1="400.0" y1="170.0" x2="500.0" y2="170.0" stroke="#D85A30" stroke-width="4" stroke-linecap="butt"/>
<text class="tl" x="450.0" y="160.0" text-anchor="middle">drag strut</text>
<circle cx="500.0" cy="170.0" r="6" fill="none" stroke="#993C1D" stroke-width="2"/>
<text class="tl" x="510.0" y="190.0" text-anchor="start">stress concentrates</text>
<text class="tl" x="510.0" y="206.0" text-anchor="start">at the corner</text>
<line x1="420.0" y1="310.0" x2="420.0" y2="274.0" stroke="#D85A30" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="450.0" y1="310.0" x2="450.0" y2="274.0" stroke="#D85A30" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="480.0" y1="310.0" x2="480.0" y2="274.0" stroke="#D85A30" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="450.0" y="328.0" text-anchor="middle">load on the wing</text>
<text class="ts" x="370.0" y="362.0" text-anchor="start">The main block chord stops at the corner.</text>
<text class="ts" x="370.0" y="379.0" text-anchor="start">A drag strut continues it across the wing,</text>
<text class="ts" x="370.0" y="396.0" text-anchor="start">so the chord force is not left at the</text>
<text class="ts" x="370.0" y="413.0" text-anchor="start">corner, where it would tear the slab.</text></svg>