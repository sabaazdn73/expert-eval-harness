.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Green roof: saturated weight for gravity, dry weight for uplift</title><desc>Two stacked bars of roof dead load on a light steel-deck roof: saturated (deck 1.0, substrate 4.5, drainage 0.3, total 5.8 kN/m2) and dry (1.0, 2.75, 0.1, total 3.85 kN/m2). Against a strength-level net uplift of 3.8 kN/m2, 0.9D minus W is +1.42 when saturated and -0.33 when dry: the dry case lifts.</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Roof corner zone, per m²</text>
