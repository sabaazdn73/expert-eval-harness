<text class="ts" x="444.0" y="268.0" text-anchor="start"></text>
<text class="ts" x="444.0" y="285.0" text-anchor="start">Check each by load path and</text>
<text class="ts" x="444.0" y="302.0" text-anchor="start">by area: both must agree.</text></svg>