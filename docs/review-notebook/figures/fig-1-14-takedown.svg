.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Column load takedown through four garage levels</title><desc>Elevation of an interior column through four parking levels. Each level adds 590.6 kN dead load from the floor plus 20 kN column self-weight, and 162 kN live load. Cumulative dead load at the foundation is 2442.5 kN; live load 648 kN, or 518.4 kN with the 20 percent garage reduction for members supporting two or more floors.</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/><line x1="60.0" y1="90.0" x2="240.0" y2="90.0" stroke="#7F77DD" stroke-width="6" stroke-linecap="butt"/>
