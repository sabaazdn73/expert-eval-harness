<text class="ts" x="52.0" y="342.0" text-anchor="start">Add slab self-weight: 1.2 × 25 × 64 / 4 = 480 kN per column from this bay.</text>
<text class="ts" x="52.0" y="360.0" text-anchor="start">The rigid-plate split is only a first estimate: a real slab is flexible, so model it</text>
<text class="ts" x="52.0" y="378.0" text-anchor="start">with its stiffness, and check punching at the landing and at the supports.</text></svg>