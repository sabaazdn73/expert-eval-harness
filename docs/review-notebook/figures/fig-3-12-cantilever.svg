<text class="ts" x="215.0" y="252.0" text-anchor="middle">centroid</text>
<text class="ts" x="80.0" y="274.0" text-anchor="middle">−13.5 m</text>
<text class="tl" x="80.0" y="292.0" text-anchor="middle" style="fill:#993C1D">T 22.5</text>
<text class="ts" x="170.0" y="274.0" text-anchor="middle">−4.5 m</text>
<text class="tl" x="170.0" y="292.0" text-anchor="middle" style="fill:#993C1D">T 7.5</text>
<text class="ts" x="260.0" y="274.0" text-anchor="middle">+4.5 m</text>
<text class="tl" x="260.0" y="292.0" text-anchor="middle" style="fill:#0F6E56">C 7.5</text>
<text class="ts" x="350.0" y="274.0" text-anchor="middle">+13.5 m</text>
<text class="tl" x="350.0" y="292.0" text-anchor="middle" style="fill:#0F6E56">C 22.5</text>
<text class="ts" x="22.0" y="314.0" text-anchor="start">T = tension, C = compression (kN)</text>
<text class="th" x="170.0" y="346.0" text-anchor="end">Cantilever</text>
<text class="th" x="250.0" y="346.0" text-anchor="end">Model</text>
<text class="th" x="330.0" y="346.0" text-anchor="end">Portal</text>
<text class="ts" x="30.0" y="368.0" text-anchor="start">Exterior N (kN)</text>
<text class="tl" x="170.0" y="368.0" text-anchor="end">22.5</text>
<text class="tl" x="250.0" y="368.0" text-anchor="end">21.1</text>
<text class="tl" x="330.0" y="368.0" text-anchor="end">25.0</text>
<text class="ts" x="30.0" y="390.0" text-anchor="start">Interior N (kN)</text>
<text class="tl" x="170.0" y="390.0" text-anchor="end">7.5</text>
<text class="tl" x="250.0" y="390.0" text-anchor="end">2.1 C</text>
<text class="tl" x="330.0" y="390.0" text-anchor="end">0.0</text>
<rect x="410.0" y="60.0" width="260.0" height="392.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="422.0" y="84.0" text-anchor="start">Overturning at mid-height of</text>
<text class="ts" x="422.0" y="102.0" text-anchor="start">  the bottom storey:</text>
<text class="ts" x="422.0" y="120.0" text-anchor="start">  100 × 5.625 + 60 × 1.875</text>
<text class="ts" x="422.0" y="138.0" text-anchor="start">  = 675 kN·m</text>
<text class="ts" x="422.0" y="156.0" text-anchor="start">Σd² = 2(13.5² + 4.5²) = 405 m²</text>
<text class="ts" x="422.0" y="174.0" text-anchor="start">N = M·d / Σd²: 22.5 and 7.5</text>
<text class="ts" x="422.0" y="192.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="210.0" text-anchor="start">Top storey (M = 187.5):</text>
<text class="ts" x="422.0" y="228.0" text-anchor="start">  6.25 and 2.08</text>
<text class="ts" x="422.0" y="246.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="264.0" text-anchor="start">Beam shear at a joint =</text>
<text class="ts" x="422.0" y="282.0" text-anchor="start">  change in column axial force</text>
<text class="ts" x="422.0" y="300.0" text-anchor="start">  level 1 exterior: 22.5 − 6.25</text>
<text class="ts" x="422.0" y="318.0" text-anchor="start">  = 16.25 kN</text>
<text class="ts" x="422.0" y="336.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="354.0" text-anchor="start">Model: the windward interior</text>
<text class="ts" x="422.0" y="372.0" text-anchor="start">  column is in slight compression</text>
<text class="ts" x="422.0" y="390.0" text-anchor="start">  (C): with flexible beams the</text>
<text class="ts" x="422.0" y="408.0" text-anchor="start">  interior columns carry almost</text>
<text class="ts" x="422.0" y="426.0" text-anchor="start">  none of the overturning</text></svg>