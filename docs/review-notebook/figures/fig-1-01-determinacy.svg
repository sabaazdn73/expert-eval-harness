<line x1="280.0" y1="364.0" x2="320.0" y2="364.0" stroke="#73726c" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="180.0" y="396.0" text-anchor="middle">One reaction more than equilibrium gives:</text>
<text class="ts" x="180.0" y="413.0" text-anchor="middle">needs a deflection condition (Module 3).</text>
