<text class="ts" x="42.0" y="322.0" text-anchor="start">6.4.3: at least the moments with factored L on all panels; 6.4.3.2: if L ≤ 0.75D, that is enough.</text>
<text class="ts" x="42.0" y="341.0" text-anchor="start">6.4.3.3 otherwise: positive moment with 75% of factored L on the panel and alternate panels,</text>
<text class="ts" x="42.0" y="360.0" text-anchor="start">  negative moment with 75% on the adjacent panels only. Design for the larger of the two.</text>
<text class="ts" x="42.0" y="379.0" text-anchor="start">Here the pattern governs the interior span: 371.5 against 219.6 kN·m (+69%).</text>
