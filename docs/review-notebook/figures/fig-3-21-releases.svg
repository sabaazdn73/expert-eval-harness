<rect x="30.0" y="300.0" width="640.0" height="112.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="322.0" text-anchor="start">A release removes a moment connection: the beam becomes simply supported and the</text>
<text class="ts" x="42.0" y="340.0" text-anchor="start">  columns lose their end moments. Releases on every member at a joint, or with pinned</text>
<text class="ts" x="42.0" y="358.0" text-anchor="start">  bases, leave a mechanism: an instability warning, a singular or ill-conditioned matrix</text>
<text class="ts" x="42.0" y="376.0" text-anchor="start">  or huge displacements. Some programs still print results.</text>
<text class="ts" x="42.0" y="394.0" text-anchor="start">Pinned against fixed bases, no releases: drift 25.7 against 4.95 mm under 100 kN.</text></svg>