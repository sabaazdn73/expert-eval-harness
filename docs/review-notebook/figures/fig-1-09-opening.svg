.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Floor opening with header and tail beams</title><desc>Plan of a 9 by 9 m bay with a 3 by 3 m opening that cuts the beam at y = 3 m. The cut beam becomes two 3 m tail beams that land on headers at x = 3 and 6 m; the headers span 6 m and deliver 25.03 kN each to the beams at y = 0 and 6 m. Below, the beam at y = 6 m with its uniform load and the two header loads.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="560" fill="#FFFFFF"/><rect x="50.0" y="40.0" width="270.0" height="270.0" rx="0" stroke-width="0.5" class="c-gray" opacity="0.5"/>
