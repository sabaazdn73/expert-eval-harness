.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Equivalent lateral force: base shear and its distribution</title><desc>Elevation of the office building with seismic storey forces 373.8, 756.2, 1,141.9 and 1,330.4 kN at 3.75, 7.5, 11.25 and 15 m, a base shear of 3,602 kN, six times the wind base shear. A box gives Ta = 0.533 s, Cs = 0.0938 and k = 1.017.</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Storey forces Fx (kN)</text>
<rect x="250.0" y="110.0" width="150.0" height="300.0" rx="0" stroke-width="1" class="c-white"/>
<line x1="60.0" y1="410.0" x2="420.0" y2="410.0" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="butt"/>
