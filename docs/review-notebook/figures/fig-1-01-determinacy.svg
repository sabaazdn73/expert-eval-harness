<line x1="152.0" y1="125.0" x2="100.0" y2="125.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="butt" marker-end="url(#m1D9E75)"/>
<text class="th" x="96.0" y="129.0" text-anchor="end">Ax = 43.3</text>
<line x1="160.0" y1="210.0" x2="160.0" y2="158.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="butt" marker-end="url(#m1D9E75)"/>
<text class="th" x="160.0" y="226.0" text-anchor="middle">Ay = 16.67 kN</text>
<line x1="470.0" y1="210.0" x2="470.0" y2="158.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="butt" marker-end="url(#m1D9E75)"/>
<text class="th" x="470.0" y="226.0" text-anchor="middle">By = 8.33 kN</text>
<line x1="162.0" y1="58.0" x2="261.3" y2="58.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="160.0" y1="53.0" x2="160.0" y2="63.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
