</style><title>Framing plan of a 2 by 2 bay parking floor</title><desc>Columns on a 9 m grid, girders along the column lines in one direction, secondary beams every 3 m spanning 9 m between girders, beams on column lines framing into columns, a one-way slab spanning 3 m between beams, and the 9 by 9 m tributary area of the interior column.</desc>
