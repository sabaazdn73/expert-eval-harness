.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Checking the load model against a hand estimate</title><desc>Table of load-case totals for the office building: dead load hand estimate 37,437 kN against 31,401 kN in the model (ratio 0.839, fail: superimposed dead load sits in a case not used in the combinations); office live load 6,998 kN against 145,800 kN (ratio 20.8, fail: 50 entered as kN/m2 instead of psf).</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Load-case totals: hand estimate against the model</text>
