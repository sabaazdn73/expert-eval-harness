.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Main wind force resisting system: forces at each level</title><desc>Elevation of the 15 m office building with wind on the 36 m face. Each level collects the wind on a strip half a storey above and below it: windward pressure 0.64, 0.71, 0.77 and 0.81 kPa and leeward suction 0.51 kPa. Level forces are 154.9, 163.9, 172.1 and 89.2 kN, 580.1 kN in the ground storey; the bottom half storey, 77.4 kN, goes straight to the foundation.</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Section along the wind, B = 36 m, L = 27 m, h = 15 m</text>
