.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Deflection by virtual work: column flexibility</title><desc>Canopy frame: 500 by 500 column 4 m high fixed at the base, 400 by 600 cantilever beam 3 m long, 50 kN at the tip, gross sections. Tip deflection 15.85 mm: 2.43 mm from bending of the beam and 13.43 mm from rotation of the column top, 85% of the total.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Canopy: where the tip deflection comes from</text>
