<text class="ts" x="372.0" y="332.0" text-anchor="start">  δ ≥ k1 + k2·xu/d = 0.44 + 1.25 × 0.18</text>
<text class="ts" x="372.0" y="350.0" text-anchor="start">    = 0.665</text>
<text class="ts" x="372.0" y="368.0" text-anchor="start">  δ ≥ k5 = 0.7 (class B or C steel)</text>
