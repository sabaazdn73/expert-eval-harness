<text class="ts" x="422.0" y="131.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="148.0" text-anchor="start">Snow 0.84 × 6 = 5.04 kN/m on plan</text>
<text class="ts" x="422.0" y="165.0" text-anchor="start">  total 50.4 kN</text>
<text class="ts" x="422.0" y="182.0" text-anchor="start">  as 5.04 per sloping m: 58.2 kN</text>
<text class="ts" x="422.0" y="199.0" text-anchor="start">  (+15.5%)</text>
