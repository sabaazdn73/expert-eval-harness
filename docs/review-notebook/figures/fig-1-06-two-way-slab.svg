.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Two-way slab panel: 45 degree load distribution</title><desc>Plan of a 6 by 9 m two-way panel with 45 degree lines from each corner. The short beams take triangles, the long beams take trapezoids. Short beam: triangular load peaking at 21 kN/m, reactions 31.5 kN, moment 63 kN m. Long beam: trapezoidal load peaking at 21 kN/m, reactions 63 kN, moment 181.1 kN m.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="32.0" text-anchor="start">Plan, w = 7 kN/m² (service, for the example)</text>
