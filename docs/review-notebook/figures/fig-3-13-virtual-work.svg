<text class="ts" x="312.0" y="222.0" text-anchor="start">Virtual work: δ = Σ ∫ M·m / EI dx</text>
<text class="ts" x="312.0" y="239.0" text-anchor="start">  beam: M = −Px, m = −x over a = 3 m</text>
<text class="ts" x="312.0" y="256.0" text-anchor="start">  column: M = Pa, m = a over h = 4 m</text>
<text class="ts" x="312.0" y="273.0" text-anchor="start">  δ = Pa³/3EIb + Pa²h/EIc</text>
<text class="ts" x="312.0" y="290.0" text-anchor="start">  = 2.43 + 13.43 = 15.85 mm</text>
<text class="ts" x="312.0" y="307.0" text-anchor="start">Model: 15.88 mm (adds column shortening)</text>
<text class="ts" x="312.0" y="324.0" text-anchor="start">Sway of the column top: 8.95 mm</text>
<text class="ts" x="312.0" y="341.0" text-anchor="start"></text>
<text class="ts" x="312.0" y="358.0" text-anchor="start">Column 6 m: 22.57 mm, 89% from the column</text>
<text class="ts" x="312.0" y="375.0" text-anchor="start">Gross sections for illustration; deflection</text>
<text class="ts" x="312.0" y="392.0" text-anchor="start">  checks use effective stiffness</text></svg>