.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Reactions under lateral load: the equilibrium check</title><desc>Base reactions of the 3 by 2 frame under 100 and 60 kN. Horizontal reactions add to 160 kN. Overturning about the base, 975 kN·m, is resisted 56% by the axial couple of the columns (547.2 kN·m) and 44% by the base moments (427.8 kN·m).</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Base reactions of the 3 × 2 frame (kN, kN·m)</text>
