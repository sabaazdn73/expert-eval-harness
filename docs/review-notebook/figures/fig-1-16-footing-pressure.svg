.tl{font-size:12px;fill:#2C2C2A}.tt{font-size:15px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-coral{fill:#FAECE7;stroke:#993C1D}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Soil pressure under an eccentrically loaded strip footing</title><desc>Two 2 m wide strip footings carrying 300 kN per metre. Left: moment 30 kN m per metre, eccentricity 0.1 m, inside the middle third; pressure 195 to 105 kPa. Right: moment 120 kN m per metre, eccentricity 0.4 m, outside the middle third; triangular pressure over 1.8 m, peak 333.3 kPa, and no contact over 0.2 m.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/><text class="th" x="50.0" y="34.0" text-anchor="start">e = 0.10 m ≤ B/6 = 0.333 m</text>
<rect x="70.0" y="130.0" width="220.0" height="34.0" rx="0" stroke-width="1" class="c-gray"/>
<rect x="160.0" y="76.0" width="40.0" height="54.0" rx="0" stroke-width="1" class="c-gray"/>
<line x1="191.0" y1="52.0" x2="191.0" y2="74.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="ts" x="185.0" y="60.0" text-anchor="end">P = 300 kN/m, e = 0.1 m</text>
<line x1="180.0" y1="70.0" x2="180.0" y2="172.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" stroke-dasharray="3 3"/>
<polygon points="70.0,172.0 290.0,172.0 290.0,236.4 70.0,206.7" stroke-width="1" class="c-coral"/>
<text class="tl" x="294.0" y="236.4" text-anchor="start">195 kPa</text>
<text class="tl" x="66.0" y="210.7" text-anchor="end">105</text>
<text class="tl" x="282.0" y="152.0" text-anchor="end">B = 2 m</text>
<text class="th" x="380.0" y="34.0" text-anchor="start">e = 0.40 m &gt; B/6: partial contact</text>
<rect x="400.0" y="130.0" width="220.0" height="34.0" rx="0" stroke-width="1" class="c-gray"/>
<rect x="490.0" y="76.0" width="40.0" height="54.0" rx="0" stroke-width="1" class="c-gray"/>
<line x1="554.0" y1="52.0" x2="554.0" y2="74.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="ts" x="548.0" y="60.0" text-anchor="end">P = 300 kN/m, e = 0.4 m</text>
<line x1="510.0" y1="70.0" x2="510.0" y2="172.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" stroke-dasharray="3 3"/>
<polygon points="422.0,172.0 620.0,172.0 620.0,282.0" stroke-width="1" class="c-coral"/>
<text class="tl" x="614.0" y="298.0" text-anchor="end">333.3 kPa</text>
<line x1="424.0" y1="318.0" x2="618.0" y2="318.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="422.0" y1="313.0" x2="422.0" y2="323.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="620.0" y1="313.0" x2="620.0" y2="323.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="521.0" y="313.0" text-anchor="middle">contact 1.8 m</text>
<text class="tl" x="411.0" y="188.0" text-anchor="middle">gap</text>
<text class="tl" x="612.0" y="152.0" text-anchor="end">B = 2 m</text>
<rect x="40.0" y="330.0" width="630.0" height="70.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="52.0" y="352.0" text-anchor="start">Inside the middle third: q = P/B (1 ± 6e/B) = 150 (1 ± 0.3) = 195 / 105 kPa.</text>
<text class="ts" x="52.0" y="370.0" text-anchor="start">Outside: q max = 2P / (3(B/2 − e)) = 600 / 1.8 = 333.3 kPa over 3(B/2 − e) = 1.8 m.</text>
<text class="ts" x="52.0" y="388.0" text-anchor="start">A mat follows the same idea in two directions: q = P/A ± Mx·y/Ix ± My·x/Iy.</text></svg>