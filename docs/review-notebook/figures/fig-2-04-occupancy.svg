.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>A beam carrying two occupancies</title><desc>Plan of a 9 m bay with secondary beams every 3 m. Beam B2, on the line 3 m from the girder, has a tributary strip from 1.5 to 4.5 m: corridor (3.83 kN/m2) on its upper 1.5 m and office (2.40 kN/m2) on its lower 1.5 m. Its line load is 1.5 x 2.40 + 1.5 x 3.83 = 9.35 kN/m, 30% above the all-office 7.2 kN/m.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Plan, office floor above the first floor</text>
