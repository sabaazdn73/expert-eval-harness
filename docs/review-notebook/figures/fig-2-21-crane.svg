<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><style>text{font-family:"DejaVu Sans",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.tl{font-size:12px;fill:#2C2C2A}.tt{font-size:15px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-coral{fill:#FAECE7;stroke:#993C1D}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Crane runway forces</title><desc>Elevation of a crane runway beam with two crane wheels of 90 kN maximum load. Vertical impact adds 10% for service class B (99 kN) or 25% for class D (112.5 kN). The lateral force is 20% of the rated capacity plus trolley and hoist, 24 kN in total, 6 kN per wheel across the beam; the longitudinal force is 10% of the wheel load, 9 kN per wheel.</desc><defs><marker id="m0F6E56" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Runway beam, one side of the crane (kN per wheel)</text>
<rect x="60.0" y="250.0" width="560.0" height="18.0" rx="0" stroke-width="0.8" class="c-purple"/>
<rect x="60.0" y="268.0" width="30.0" height="50.0" rx="0" stroke-width="0.6" class="c-gray"/>
<rect x="590.0" y="268.0" width="30.0" height="50.0" rx="0" stroke-width="0.6" class="c-gray"/>
<rect x="230.0" y="184.0" width="200.0" height="22.0" rx="0" stroke-width="1" class="c-white"/>
<text class="ts" x="440.0" y="199.0" text-anchor="start">crane end truck</text>
<circle cx="270.0" cy="236.0" r="13" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="270.0" y1="130.0" x2="270.0" y2="220.0" stroke="#D85A30" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="254.0" y1="246.0" x2="204.0" y2="246.0" stroke="#0F6E56" stroke-width="2" stroke-linecap="butt" marker-end="url(#m0F6E56)"/>
<circle cx="390.0" cy="236.0" r="13" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="390.0" y1="130.0" x2="390.0" y2="220.0" stroke="#D85A30" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="374.0" y1="246.0" x2="324.0" y2="246.0" stroke="#0F6E56" stroke-width="2" stroke-linecap="butt" marker-end="url(#m0F6E56)"/>
<text class="th" x="330.0" y="118.0" text-anchor="middle">each wheel: 90 → 99 (class A–C) or 112.5 (class D–F)</text>
<text class="th" x="204.0" y="240.0" text-anchor="end">9</text>
<text class="th" x="324.0" y="240.0" text-anchor="end">9</text>
<text class="ts" x="330.0" y="294.0" text-anchor="middle">lateral 6 per wheel acts across the beam, at the top of the rail</text>
<rect x="30.0" y="330.0" width="638.0" height="130.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="352.0" text-anchor="start">Vertical (ASCE 7-22 4.9.3): service class A, B, C +10% → 99;  D, E, F +25% → 112.5</text>
<text class="ts" x="42.0" y="370.0" text-anchor="start">Lateral (4.9.4): 20% × (100 rated + 20 trolley and hoist) = 24 kN, 12 per runway, 6 per wheel</text>
<text class="ts" x="42.0" y="388.0" text-anchor="start">Longitudinal (4.9.5): 10% of the maximum wheel load = 9 kN per wheel (green arrows)</text>
<text class="ts" x="42.0" y="406.0" text-anchor="start">ASCE 7-16 set the vertical impact by how the crane is operated (cab or pendant).</text>
<text class="ts" x="42.0" y="424.0" text-anchor="start">No impact on the lateral and longitudinal forces: they are already percentages.</text></svg>