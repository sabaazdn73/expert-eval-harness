.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Horizontal ties for robustness</title><desc>Plan of three by three 9 m bays: internal ties along every grid line, peripheral ties round the edge, and each column tied in. With 5.5 kN/m² dead, 2.0 kN/m² live and psi 0.5, internal ties 421.2 kN and peripheral ties 210.6 kN.</desc><defs></defs><rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/><rect x="40.0" y="40.0" width="297.0" height="297.0" rx="0" stroke-width="0.6" class="c-gray" opacity="0.5"/>
