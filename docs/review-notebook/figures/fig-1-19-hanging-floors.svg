.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Floors hung from a roof truss: the load goes up first</title><desc>Elevation: three floors of 300 kN each hang from a central hanger fixed to a 16 m roof truss between two cores. Hanger tension is 300, 600 and 900 kN from the bottom up; with a 200 kN truss the cores each receive 550 kN.</desc><defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m993C1D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/><rect x="50.0" y="60.0" width="40.0" height="330.0" rx="0" stroke-width="1" class="c-gray"/>
