<text class="ts" x="42.0" y="332.0" text-anchor="start">  section 400 × 600, d = 540, 4 bars 25 mm</text>
<text class="ts" x="42.0" y="350.0" text-anchor="start">  c = 97.1 mm, εt = 0.0137 ≥ 0.0075</text>
<text class="ts" x="42.0" y="368.0" text-anchor="start">  limit = least of 1000εt % and 20%</text>
<text class="ts" x="42.0" y="386.0" text-anchor="start">  = 13.7%</text>
<text class="ts" x="42.0" y="404.0" text-anchor="start">  6.5.3: not for Table 6.5.2 moments</text>
<text class="ts" x="42.0" y="422.0" text-anchor="start">  equilibrium kept for each load case</text>
