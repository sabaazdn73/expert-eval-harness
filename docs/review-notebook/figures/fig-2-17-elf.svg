<line x1="186.3" y1="335.0" x2="246.0" y2="335.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="180.3" y="339.0" text-anchor="end">373.8</text>
<line x1="250.0" y1="260.0" x2="400.0" y2="260.0" stroke="#B4B2A9" stroke-width="1" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="151.8" y1="260.0" x2="246.0" y2="260.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="145.8" y="264.0" text-anchor="end">756.2</text>
<line x1="250.0" y1="185.0" x2="400.0" y2="185.0" stroke="#B4B2A9" stroke-width="1" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="117.0" y1="185.0" x2="246.0" y2="185.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="111.0" y="189.0" text-anchor="end">1,141.9</text>
<line x1="250.0" y1="110.0" x2="400.0" y2="110.0" stroke="#B4B2A9" stroke-width="1" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="100.0" y1="110.0" x2="246.0" y2="110.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="94.0" y="114.0" text-anchor="end">1,330.4</text>
<line x1="390.0" y1="432.0" x2="260.0" y2="432.0" stroke="#1D9E75" stroke-width="2" stroke-linecap="butt" marker-end="url(#m1D9E75)"/>
<text class="th" x="325.0" y="450.0" text-anchor="middle">V = 3,602 kN</text>
<rect x="430.0" y="60.0" width="238.0" height="330.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="442.0" y="84.0" text-anchor="start">Ta = 0.0466 × 15^0.9 = 0.533 s</text>
<text class="ts" x="442.0" y="101.0" text-anchor="start">  (concrete moment frame)</text>
<text class="ts" x="442.0" y="118.0" text-anchor="start">Cs = SDS/(R/Ie) = 0.8/8 = 0.100</text>
<text class="ts" x="442.0" y="135.0" text-anchor="start">cap SD1/(T R/Ie)</text>
<text class="ts" x="442.0" y="152.0" text-anchor="start">  = 0.4/(0.533 × 8) = 0.0938</text>
<text class="ts" x="442.0" y="169.0" text-anchor="start">floor 0.044 × 0.8 = 0.035</text>
<text class="ts" x="442.0" y="186.0" text-anchor="start">Cs = 0.0938</text>
<text class="ts" x="442.0" y="203.0" text-anchor="start">V = 0.0938 × 38,413</text>
<text class="ts" x="442.0" y="220.0" text-anchor="start">  = 3,602 kN</text>
<text class="ts" x="442.0" y="237.0" text-anchor="start"></text>
<text class="ts" x="442.0" y="254.0" text-anchor="start">k = 1 + (0.533 − 0.5)/2 = 1.017</text>
<text class="ts" x="442.0" y="271.0" text-anchor="start">Fx = V wx hx^k / Σ wi hi^k</text>
<text class="ts" x="442.0" y="288.0" text-anchor="start"></text>
<text class="ts" x="442.0" y="305.0" text-anchor="start">Wind (2.13): 580 kN</text>
<text class="ts" x="442.0" y="322.0" text-anchor="start">Seismic governs, 6.2 ×</text></svg>