.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Envelope corners against concurrent forces</title><desc>Scatter of axial force P against moment M for four combinations at a column base: (3,000, 40), (2,300, 220), (1,300, 230) and (1,050, 270) kN and kN·m. The envelope corner (Pmax 3,000 with Mmax 270) is not a real combination. On a 3 by 3 m footing the corner gives a minimum soil pressure of 273 kPa, while the real worst, 0.9D - Ev + E, gives 56.7 kPa, much closer to lifting off.</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Column base: (P, M) for each combination</text>
