.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Effective flange width of a T-beam</title><desc>Floor section with 300 by 450 mm beams at 3 m and a 200 mm slab. ACI 318-19 Table 6.3.2.1 gives 1.075 m each side of the web, bf = 2.45 m. EN 1992-1-1 5.3.2.1 gives beff = 2.10 m in an interior span and 1.38 m over a support. The T-section is about 2.3 times as stiff as the web alone.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Floor section: beams 300 × 450 at 3 m, slab 200 mm, span 9 m</text>
