<text class="ts" x="42.0" y="339.0" text-anchor="start">  least of 8h = 1.60, sw/2 = 1.35, ln/8 = 1.075</text>
<text class="ts" x="42.0" y="356.0" text-anchor="start">EN 1992-1-1 5.3.2.1: beff,i = 0.2bi + 0.1l0</text>
