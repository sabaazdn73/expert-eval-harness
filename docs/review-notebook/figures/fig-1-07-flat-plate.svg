<text class="ts" x="462.0" y="64.0" text-anchor="start">250 mm slab, 6.25 kN/m²</text>
<text class="ts" x="462.0" y="81.0" text-anchor="start">SDL 1.5, L 2.5 kN/m²</text>
<text class="ts" x="462.0" y="98.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="115.0" text-anchor="start">Interior column</text>
<text class="ts" x="462.0" y="132.0" text-anchor="start">  D = 56.25 × 7.75 = 435.9 kN</text>
<text class="ts" x="462.0" y="149.0" text-anchor="start">  L = 56.25 × 2.5 = 140.6 kN</text>
<text class="ts" x="462.0" y="166.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="183.0" text-anchor="start">Factored, 1.2D + 1.6L</text>
<text class="ts" x="462.0" y="200.0" text-anchor="start">  qu = 13.3 kN/m²</text>
<text class="ts" x="462.0" y="217.0" text-anchor="start">  ACI 318: Vu at d/2 (d = 210):</text>
<text class="ts" x="462.0" y="234.0" text-anchor="start">  13.3 × (56.25 − 0.71²)</text>
<text class="ts" x="462.0" y="251.0" text-anchor="start">  = 741.4 kN</text>
<text class="ts" x="462.0" y="268.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="285.0" text-anchor="start">No beams: the slab–column</text>
<text class="ts" x="462.0" y="302.0" text-anchor="start">joint carries everything.</text>
<text class="ts" x="462.0" y="319.0" text-anchor="start">Edge columns also take an</text>
<text class="ts" x="462.0" y="336.0" text-anchor="start">unbalanced moment.</text></svg>