.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Cantilever method: column axial forces</title><desc>Overturning at the inflection level of the bottom storey, 675 kN·m, taken by column axial forces proportional to distance from the centroid (13.5 and 4.5 m, equal areas): 22.5 kN in the exterior and 7.5 kN in the interior columns. The model gives 21.1 kN in the exterior columns and only 2.1 kN, of the opposite sign, in the interior ones; the portal method gives 25.0 and 0 kN.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Cantilever method: axial forces from overturning</text>
