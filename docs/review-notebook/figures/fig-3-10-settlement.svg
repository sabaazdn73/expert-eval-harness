<text class="ts" x="492.0" y="84.0" text-anchor="start">M_B = 3EIΔ/L²</text>
<text class="ts" x="492.0" y="102.0" text-anchor="start">  cracked (0.35Ig): 36.0</text>
<text class="ts" x="492.0" y="120.0" text-anchor="start">  gross: 103.0</text>
<text class="ts" x="492.0" y="138.0" text-anchor="start">R_B falls by 6EIΔ/L³</text>
<text class="ts" x="492.0" y="156.0" text-anchor="start">  cracked: 8.0 kN</text>
<text class="ts" x="492.0" y="174.0" text-anchor="start"></text>
<text class="ts" x="492.0" y="192.0" text-anchor="start">With gravity (cracked):</text>
<text class="ts" x="492.0" y="210.0" text-anchor="start">  over B 415.3 → 379.3</text>
<text class="ts" x="492.0" y="228.0" text-anchor="start">  span 233.6 → 247.3</text>
<rect x="30.0" y="300.0" width="640.0" height="120.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="322.0" text-anchor="start">ACI 318-19 5.3.6: differential settlement is a load effect T where it can be adverse; load factor ≥ 1.0.</text>
<text class="ts" x="42.0" y="340.0" text-anchor="start">A settling interior support unloads its own hogging and loads the spans;</text>
<text class="ts" x="42.0" y="358.0" text-anchor="start">  a settling end support adds hogging at the first interior support.</text>
<text class="ts" x="42.0" y="376.0" text-anchor="start">Creep relaxes the effect: match the stiffness to when the settlement happens.</text>
<text class="ts" x="42.0" y="394.0" text-anchor="start">The settlement value comes from the geotechnical report, not from the structural model.</text></svg>