.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Load direction and projection on a sloping member</title><desc>Rafter spanning 10 m on plan at 30 degrees, frames at 6 m. Snow 0.84 kN/m² on plan gives 5.04 kN/m per metre on plan, 50.4 kN in total; applied per metre of the 11.55 m sloping length it becomes 58.2 kN (+15.5%). Self-weight 3 kN/m along the member is 34.6 kN; applied per metre on plan it becomes 30.0 kN (−13.4%).</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Rafter 10 m on plan at 30°, frames at 6 m</text>
