.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Flexible against rigid diaphragm distribution</title><desc>Plan 24 by 12 m with walls A at x = 0, B at x = 12 and C at x = 24, C twice as stiff. 600 kN uniform along the length. Flexible: 150, 300, 150 kN by tributary length. Rigid: centre of rigidity at 15 m, 3 m from the centre of mass; direct shear 150, 150, 300 plus torsion 68.2, 13.6 and minus 81.8 gives 218.2, 163.6, 218.2 kN.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/><rect x="110.0" y="50.0" width="432.0" height="216.0" rx="0" stroke-width="0.6" class="c-gray" opacity="0.6"/>
