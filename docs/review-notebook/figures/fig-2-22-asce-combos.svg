<rect x="40.0" y="316.0" width="628.0" height="142.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="52.0" y="338.0" text-anchor="start">D 2,918.8, L 408.2, Lr 47.0, S 97.2 (pm, principal) or 68.0 (pf, companion), W ±150.</text>
<text class="ts" x="52.0" y="358.0" text-anchor="start">2a governs: 1.2 × 2,918.8 + 1.6 × 408.2 + 0.5 × 47.0 = 4,179.2 kN (0.5Lr 23.5 &gt; 0.3S 20.4).</text>
<text class="ts" x="52.0" y="378.0" text-anchor="start">ASCE 7-22: 1.0S as principal, 0.3S as companion (7-16: 1.6S and 0.5S).</text>
<text class="ts" x="52.0" y="398.0" text-anchor="start">0.5L in 3a and 4a for offices (Lo ≤ 4.78 kN/m²); not in garages or assembly.</text>
<text class="ts" x="52.0" y="418.0" text-anchor="start">5a = 0.9 × 2,918.8 − 150 = 2,476.9 kN: lowest compression.  ASD: D + L = 3,327.0.</text></svg>