.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Cracked stiffness changes the drift</title><desc>One-bay portal, 9 m by 3.75 m, fixed bases, 100 kN at beam level. Lateral drift: gross sections 2.78 mm; ACI 318-19 service-level stiffness (1.4 times the factored values) 3.55 mm; ACI factored-level (columns 0.70 Ig, beam 0.35 Ig) 4.95 mm; EN 1998-1 one-half of uncracked 5.52 mm.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">One-bay portal under 100 kN: drift for four stiffness assumptions</text>
