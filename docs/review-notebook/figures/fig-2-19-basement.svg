.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Basement wall: soil, water and surcharge pressure</title><desc>Section of a 3.5 m basement wall propped by the ground floor slab, with the water table 2.0 m below the top. At-rest soil pressure (K0 = 0.5) rises to 18.0 kPa at the water table and 25.6 kPa at the base using the submerged unit weight; water adds 14.7 kPa at the base; a 10 kPa surcharge adds 5.0 kPa throughout. Total 45.4 kPa at the base, 79.3 kN per m of wall.</desc><defs><marker id="m185FA5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Pressure on the wall, per metre run</text>
<rect x="136.0" y="90.0" width="14.0" height="245.0" rx="0" stroke-width="0.8" class="c-gray"/>
<rect x="20.0" y="80.0" width="130.0" height="12.0" rx="0" stroke-width="0.6" class="c-gray"/>
<text class="ts" x="80.0" y="74.0" text-anchor="middle">ground floor slab</text>
<rect x="20.0" y="335.0" width="144.0" height="14.0" rx="0" stroke-width="0.6" class="c-gray"/>
<text class="ts" x="60.0" y="365.0" text-anchor="middle">basement slab</text>
