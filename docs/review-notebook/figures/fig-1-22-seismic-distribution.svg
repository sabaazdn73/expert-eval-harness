.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Vertical distribution of seismic base shear</title><desc>Elevation of a four-storey building with storey weights 3000, 3000, 3000 and 2500 kN at heights 3.5, 7, 10.5 and 14 m and base shear 900 kN. Storey forces 96.4, 192.9, 289.3 and 321.4 kN; storey shears 321.4, 610.7, 803.6 and 900 kN.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><rect x="170.0" y="80.0" width="150.0" height="320.0" rx="0" stroke-width="0.8" class="c-gray" opacity="0.6"/>
