<text class="tl" x="188.5" y="133.0" text-anchor="middle">internal tie</text>
<text class="tl" x="188.5" y="34.0" text-anchor="middle">peripheral tie</text>
<rect x="370.0" y="40.0" width="295.0" height="300.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="382.0" y="64.0" text-anchor="start">EN 1991-1-7 Annex A, framed structure</text>
<text class="ts" x="382.0" y="81.0" text-anchor="start">(check the National Annex):</text>
<text class="ts" x="382.0" y="98.0" text-anchor="start"></text>
<text class="ts" x="382.0" y="115.0" text-anchor="start">Ti = 0.8 (gk + ψ qk) s L ≥ 75 kN</text>
<text class="ts" x="382.0" y="132.0" text-anchor="start">Tp = 0.4 (gk + ψ qk) s L ≥ 75 kN</text>
<text class="ts" x="382.0" y="149.0" text-anchor="start"></text>
<text class="ts" x="382.0" y="166.0" text-anchor="start">gk = 590.6 / 81 = 7.29 (slab + beams)</text>
<text class="ts" x="382.0" y="183.0" text-anchor="start">qk = 2.0, ψ2 = 0.6 (parking)</text>
<text class="ts" x="382.0" y="200.0" text-anchor="start">s = L = 9 m</text>
<text class="ts" x="382.0" y="217.0" text-anchor="start">Ti = 0.8 × 8.49 × 81 = 550.3 kN</text>
<text class="ts" x="382.0" y="234.0" text-anchor="start">Tp = 0.4 × 8.49 × 81 = 275.1 kN</text>
<text class="ts" x="382.0" y="251.0" text-anchor="start"></text>
<text class="ts" x="382.0" y="268.0" text-anchor="start">Ties let the floor hang on after a</text>
<text class="ts" x="382.0" y="285.0" text-anchor="start">column is lost (catenary action).</text></svg>