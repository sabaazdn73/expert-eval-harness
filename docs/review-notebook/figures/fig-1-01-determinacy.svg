<line x1="500.0" y1="364.0" x2="540.0" y2="364.0" stroke="#73726c" stroke-width="1" stroke-linecap="butt"/>
<polygon points="640.0,340.0 628.0,355.0 652.0,355.0" stroke-width="1" fill="none" stroke="#73726c"/>
<circle cx="634.0" cy="359.0" r="3.5" fill="none" stroke="#73726c" stroke-width="1"/>
<circle cx="646.0" cy="359.0" r="3.5" fill="none" stroke="#73726c" stroke-width="1"/>
<line x1="620.0" y1="364.0" x2="660.0" y2="364.0" stroke="#73726c" stroke-width="1" stroke-linecap="butt"/>
<line x1="560.0" y1="312.0" x2="640.0" y2="312.0" stroke="#993C1D" stroke-width="2" stroke-linecap="butt" marker-end="url(#m993C1D)"/>
<text class="ts" x="600.0" y="304.0" text-anchor="middle">any sideways push</text>
<text class="ts" x="520.0" y="396.0" text-anchor="middle">All reactions parallel: nothing resists</text>
<text class="ts" x="520.0" y="413.0" text-anchor="middle">ΣFx. Counting r alone is not enough.</text></svg>