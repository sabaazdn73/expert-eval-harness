.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Internal pressure: enclosed against partially enclosed</title><desc>Two building sections with internal pressure pushing out on every inside face. Enclosed (GCpi = +/-0.18): leeward wall -0.72 kPa with +GCpi, windward wall +1.03 kPa with -GCpi. Partially enclosed (GCpi = +/-0.55): -1.17 and +1.47 kPa. Both signs are checked because the opening can face any wind direction.</desc><defs><marker id="m0F6E56" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="30.0" y="28.0" text-anchor="start">a.  Enclosed, GCpi = ±0.18</text>
