.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Composite deck direction decides which members carry the load</title><desc>Two plans of a 9 by 9 m bay with beams at 3 m. Left, correct: deck ribs span 3 m between beams, beams carry 12 kN/m and give 54 kN reactions; the interior girder takes 216 kN as point loads. Right, wrong: ribs modelled parallel to the beams, the load goes straight to the girders, 324 kN each, and the beams carry nothing.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/><text class="th" x="30.0" y="36.0" text-anchor="start">Correct: ribs span 3 m to the beams</text>
