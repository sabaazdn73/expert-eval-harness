.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Wind load path: facade to diaphragm to walls</title><desc>Section of a building with 3.5 m storeys. A combined wind pressure of 1.2 kPa on the facade gives 2.1 kN/m to each floor edge from each panel, 4.2 kN/m per floor; over a 30 m facade, 126 kN per floor and 63 kN at the roof. Each floor diaphragm delivers its force to the shear walls, which take it to the foundation.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m854F0B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/><line x1="170.0" y1="410.0" x2="520.0" y2="410.0" stroke="#2C2C2A" stroke-width="4" stroke-linecap="butt"/>
