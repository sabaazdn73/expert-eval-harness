<text class="ts" x="42.0" y="292.0" text-anchor="start">Shear building: k = Σ12EIc/h³ = 4 × 12 × E × 0.70Ic / 3.75³ = 85,428 kN/m → 1.87 mm</text>
<text class="ts" x="42.0" y="312.0" text-anchor="start">Model with the real beams: k = 43,149 kN/m → 3.71 mm (×1.98); drift ratio 0.099%</text>
<text class="ts" x="42.0" y="332.0" text-anchor="start">Beams 400 × 800: 2.88 mm (×1.54). The rigid-beam assumption holds only for beams</text>
<text class="ts" x="42.0" y="352.0" text-anchor="start">  much stiffer than the columns; in flat-plate and wide-beam frames it can halve the drift.</text>
<text class="ts" x="42.0" y="372.0" text-anchor="start">ACI 318-19 6.6.3.2.2: service drift with 1.4 times the factored-level stiffness.</text></svg>