<rect x="30.0" y="330.0" width="640.0" height="112.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="352.0" text-anchor="start">ΣH: 37.0 + 44.0 + 43.4 + 35.6 = 160.0 kN = 100 + 60</text>
<text class="ts" x="42.0" y="372.0" text-anchor="start">Overturning: 100 × 7.5 + 60 × 3.75 = 975 kN·m = axial couple 547.2 + base moments 427.8</text>
<text class="ts" x="42.0" y="392.0" text-anchor="start">Axial couple share 56%: taking all 975 kN·m by axial forces would give 32.5 kN in the</text>
<text class="ts" x="42.0" y="412.0" text-anchor="start">  exterior columns, against 21.1 kN in the model. ΣN = 0 under lateral load alone.</text>
<rect x="410.0" y="60.0" width="260.0" height="150.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="422.0" y="84.0" text-anchor="start">Check before any member:</text>
<text class="ts" x="422.0" y="104.0" text-anchor="start">  ΣH = applied lateral load</text>
<text class="ts" x="422.0" y="124.0" text-anchor="start">  ΣV = applied gravity load</text>
<text class="ts" x="422.0" y="144.0" text-anchor="start">  ΣM about a base point = 0</text>
<text class="ts" x="422.0" y="164.0" text-anchor="start">A missing roof load would</text>
<text class="ts" x="422.0" y="184.0" text-anchor="start">  show ΣH = 100, not 160</text></svg>