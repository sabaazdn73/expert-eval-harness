<text class="ts" x="42.0" y="372.0" text-anchor="start">EN 1998-1 4.3.1(7): one-half of the uncracked flexural and shear stiffness.</text>
<text class="ts" x="42.0" y="392.0" text-anchor="start">Drift against gross sections: ×1.78 (ACI factored), ×1.99 (EN 1998-1).</text>
<text class="ts" x="42.0" y="412.0" text-anchor="start">Left column, base / top moment (kN·m): Ig 116.1 / 73.1; ACI 129.0 / 59.5.</text>
<text class="ts" x="42.0" y="432.0" text-anchor="start">Softer beams restrain the column tops less, so more moment goes to the bases.</text></svg>