.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Centreline moment, face moment and rigid zones</title><desc>Moment near the interior support of two 9 m spans with 41.0 kN/m. The centreline model gives 415.3 kN·m at the support centre and 358.9 kN·m at the face of a 500 mm column. EN 1992-1-1 5.3.2.2(4) reduction for a support without rotational restraint gives 386.5. A model with rigid zones over the column width gives 392.6 kN·m at the face.</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Hogging moment near the interior support (kN·m)</text>
