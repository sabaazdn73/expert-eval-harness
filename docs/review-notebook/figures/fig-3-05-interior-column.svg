.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Interior column moment from live load on one side</title><desc>Interior joint of the subframe with factored live load 11.5 kN/m on the left span only. The unbalanced fixed-end moment 77.8 kN·m is shared in proportion to stiffness: 30.2 kN·m to each column, 8.7 kN·m to each beam. At the roof, with a column below only, the column takes 49.3 kN·m.</desc><defs><marker id="m854F0B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Subframe at an interior column (ACI 318-19 6.3.1.2, 6.4.1)</text>
