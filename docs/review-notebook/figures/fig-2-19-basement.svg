<text class="ts" x="440.0" y="224.0" text-anchor="end">water table</text>
<line x1="170.0" y1="56.0" x2="350.0" y2="56.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt"/>
<line x1="170.0" y1="56.0" x2="170.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="200.0" y1="56.0" x2="200.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="230.0" y1="56.0" x2="230.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="260.0" y1="56.0" x2="260.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="290.0" y1="56.0" x2="290.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="320.0" y1="56.0" x2="320.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<line x1="350.0" y1="56.0" x2="350.0" y2="86.0" stroke="#D85A30" stroke-width="1" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="ts" x="260.0" y="50.0" text-anchor="middle">surcharge 10 kPa</text>
<polygon points="150.0,90.0 170.0,90.0 170.0,335.0 150.0,335.0" stroke-width="1" fill="#FAEEDA" stroke="#854F0B"/>
<polygon points="170.0,90.0 242.0,230.0 272.6,335.0 170.0,335.0" stroke-width="1" fill="#F1EFE8" stroke="#5F5E5A"/>
<polygon points="242.0,230.0 331.4,335.0 272.6,335.0" stroke-width="1" fill="#B5D4F4" stroke="#185FA5"/>
<text class="ts halo" x="252.0" y="252.0" text-anchor="start">23.0 = 18.0 + 5.0</text>
<text class="th halo" x="339.4" y="339.0" text-anchor="start">45.4 kPa</text>
<text class="ts halo" x="154.0" y="120.0" text-anchor="start">q</text>
<line x1="130.0" y1="415.0" x2="130.0" y2="357.0" stroke="#185FA5" stroke-width="2" stroke-linecap="butt" marker-end="url(#m185FA5)"/>
<text class="ts" x="124.0" y="409.0" text-anchor="end">uplift 14.7 kPa</text>
<rect x="450.0" y="60.0" width="218.0" height="380.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="462.0" y="84.0" text-anchor="start">K0 = 1 − sin 30° = 0.5 (soil</text>
<text class="ts" x="462.0" y="101.0" text-anchor="start">report values, assumed; propped)</text>
<text class="ts" x="462.0" y="118.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="135.0" text-anchor="start">Above water: 0.5 × 18 × 2.0</text>
<text class="ts" x="462.0" y="152.0" text-anchor="start">  = 18.0 kPa</text>
<text class="ts" x="462.0" y="169.0" text-anchor="start">Below: γ&#x27; = 20 − 9.81 = 10.19</text>
<text class="ts" x="462.0" y="186.0" text-anchor="start">  18.0 + 0.5 × 10.19 × 1.5</text>
<text class="ts" x="462.0" y="203.0" text-anchor="start">  = 25.6 kPa</text>
<text class="ts" x="462.0" y="220.0" text-anchor="start">Water: 9.81 × 1.5 = 14.7</text>
<text class="ts" x="462.0" y="237.0" text-anchor="start">Surcharge: 0.5 × 10 = 5.0</text>
<text class="ts" x="462.0" y="254.0" text-anchor="start">Base: 25.6 + 14.7 + 5.0 = 45.4</text>
<text class="ts" x="462.0" y="271.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="288.0" text-anchor="start">Force per m: 50.7 + 11.0 + 17.5</text>
<text class="ts" x="462.0" y="305.0" text-anchor="start">  = 79.3 kN  (H, factor 1.6)</text>
<text class="ts" x="462.0" y="322.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="339.0" text-anchor="start">Slab, factored: 1.6 × 14.7 = 23.5</text>
<text class="ts" x="462.0" y="356.0" text-anchor="start">  against 0.9 × 7.5 = 6.75 kPa</text>
<text class="ts" x="462.0" y="373.0" text-anchor="start">  → slab spans 16.8 kPa upward</text></svg>