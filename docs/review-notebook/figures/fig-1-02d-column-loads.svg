<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 410" role="img"><style>
:root{--t:#73726c}
text{font-family:"DejaVu Sans",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-gray,.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-purple,.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}
.c-coral,.c-coral>rect{fill:#FAECE7;stroke:#993C1D}
.c-amber,.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}
.c-teal,.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
</style><title>Loads arriving at the interior column</title><desc>Plan view of the interior column with two girders arriving from left and right carrying 205.88 kN each and two column-line beams arriving from top and bottom carrying 89.44 kN each, summing to 590.6 kN dead load and 162 kN live load.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="130" y1="180" x2="322" y2="180" stroke="#D85A30" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
<line x1="550" y1="180" x2="358" y2="180" stroke="#D85A30" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
<line x1="340" y1="40" x2="340" y2="160" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<line x1="340" y1="320" x2="340" y2="200" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<rect class="c-gray" x="326" y="166" width="28" height="28" rx="2" stroke-width="1"/>
<text class="th" x="226" y="156" text-anchor="middle">Girder, left</text>
<text class="ts" x="226" y="208" text-anchor="middle">D 205.88 · L 54</text>
<text class="th" x="454" y="156" text-anchor="middle">Girder, right</text>
<text class="ts" x="454" y="208" text-anchor="middle">D 205.88 · L 54</text>
<text class="th" x="356" y="66">Beam on column line, top</text>
<text class="ts" x="356" y="86">D 89.44 · L 27</text>
<text class="th" x="356" y="282">Beam on column line, bottom</text>
<text class="ts" x="356" y="302">D 89.44 · L 27</text>
<rect class="c-teal" x="110" y="340" width="460" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="360" text-anchor="middle" dominant-baseline="central">D = 2 × 205.88 + 2 × 89.44 = 590.6 kN</text>
<text class="ts" x="340" y="382" text-anchor="middle" dominant-baseline="central">L = 2 × 54 + 2 × 27 = 162 kN   (all forces in kN, per floor)</text>
</svg>