.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>ASCE 7-22 strength combinations on an interior column</title><desc>Bars of factored axial force on the ground-storey interior column: 1a 4,086.3 kN, 2a 4,179.2 kN (governs), 3a 3,803.8 kN, 4a 3,880.1 kN, 5a 2,476.9 kN (minimum). A grey bar shows 3a with the ASCE 7-16 factor 1.6S: 3,862.2 kN.</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Factored axial force, interior ground-storey column (kN)</text>
