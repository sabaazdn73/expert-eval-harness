.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Flat roof snow load against the low-slope minimum</title><desc>Bars for a flat roof with pg = 1.20 kN/m2 in Risk Category II: the flat roof snow load pf = 0.7 Ce Ct pg = 0.84 kN/m2 and the minimum for low-slope roofs pm = pg = 1.20 kN/m2, which governs as a separate uniform case.</desc><defs></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Flat roof, pg = 1.20 kN/m², Ce = Ct = 1.0, Risk Category II</text>
