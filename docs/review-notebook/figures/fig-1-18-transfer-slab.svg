.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Transfer slab: where the transferred column lands</title><desc>Two plans of an 8 by 8 m bay of a 1.2 m transfer slab on four columns. Left: 1800 kN at the centre, 450 kN to each column. Right: the same load 2 m off centre; a rigid-plate estimate gives 675 kN to the near columns and 225 kN to the far ones.</desc><defs></defs><rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/><text class="th" x="50.0" y="40.0" text-anchor="start">Centred: 450 kN each</text>
