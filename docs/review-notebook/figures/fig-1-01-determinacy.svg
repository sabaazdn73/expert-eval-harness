<text class="ts" x="211.7" y="53.0" text-anchor="middle">2 m</text>
<line x1="265.3" y1="58.0" x2="468.0" y2="58.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="263.3" y1="53.0" x2="263.3" y2="63.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="470.0" y1="53.0" x2="470.0" y2="63.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="366.7" y="53.0" text-anchor="middle">4 m</text>
<rect x="490.0" y="52.0" width="175.0" height="120.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="502.0" y="74.0" text-anchor="start">ΣFx = 0: Ax = 50 cos30</text>
<text class="ts" x="502.0" y="91.0" text-anchor="start">          = 43.3 kN</text>
<text class="ts" x="502.0" y="108.0" text-anchor="start">ΣMA = 0: By·6 = 25·2</text>
<text class="ts" x="502.0" y="125.0" text-anchor="start">          By = 8.33 kN</text>
<text class="ts" x="502.0" y="142.0" text-anchor="start">ΣFy = 0: Ay = 25 − 8.33</text>
<text class="ts" x="502.0" y="159.0" text-anchor="start">          = 16.67 kN</text>
<text class="tt" x="20.0" y="262.0" text-anchor="start">b.  Fixed + roller: r = 4, degree 1</text>
<rect x="60.0" y="330.0" width="240.0" height="10.0" rx="1" stroke-width="0.6" class="c-purple"/>
<line x1="60.0" y1="322.0" x2="60.0" y2="348.0" stroke="#73726c" stroke-width="2" stroke-linecap="butt"/>
<line x1="60.0" y1="324.0" x2="51.0" y2="333.0" stroke="#73726c" stroke-width="0.8" stroke-linecap="butt"/>
