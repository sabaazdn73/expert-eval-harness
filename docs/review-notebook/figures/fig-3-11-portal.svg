<text class="ts" x="422.0" y="84.0" text-anchor="start">Portal method</text>
<text class="ts" x="422.0" y="102.0" text-anchor="start">  storey shear split 1 : 2 : 2 : 1</text>
<text class="ts" x="422.0" y="120.0" text-anchor="start">  (interior column = 2 × exterior)</text>
<text class="ts" x="422.0" y="138.0" text-anchor="start">  inflection at mid-height and</text>
<text class="ts" x="422.0" y="156.0" text-anchor="start">  midspan</text>
<text class="ts" x="422.0" y="174.0" text-anchor="start">  bottom: V = 160/6 = 26.7, 53.3</text>
<text class="ts" x="422.0" y="192.0" text-anchor="start">  base M = V·h/2 = 50.0, 100.0</text>
<text class="ts" x="422.0" y="210.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="228.0" text-anchor="start">Model (columns 0.70 Ig, beams 0.35 Ig)</text>
<text class="ts" x="422.0" y="246.0" text-anchor="start">  shears 37.0 and 44.0</text>
<text class="ts" x="422.0" y="264.0" text-anchor="start">  inflection 2.82 m and 2.55 m</text>
<text class="ts" x="422.0" y="282.0" text-anchor="start">  above the base (h = 3.75 m)</text>
<text class="ts" x="422.0" y="300.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="318.0" text-anchor="start">Very stiff beams: shears</text>
<text class="ts" x="422.0" y="336.0" text-anchor="start">  41.6 and 40.3: almost equal</text>
<text class="ts" x="422.0" y="354.0" text-anchor="start"></text>
<text class="ts" x="422.0" y="372.0" text-anchor="start">Equilibrium is right (ΣV = 160);</text>
<text class="ts" x="422.0" y="390.0" text-anchor="start">the split and the base moments</text>
<text class="ts" x="422.0" y="408.0" text-anchor="start">are not.</text></svg>