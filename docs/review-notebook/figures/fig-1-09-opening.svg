<text class="ts" x="402.0" y="130.0" text-anchor="start">  R = (29.81 + 3.375 × 6) / 2</text>
<text class="ts" x="402.0" y="147.0" text-anchor="start">    = 25.03 kN  (red dots)</text>
<text class="ts" x="402.0" y="164.0" text-anchor="start">Beams y = 0 and 6: slab unchanged,</text>
