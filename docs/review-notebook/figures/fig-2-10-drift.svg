.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Leeward snow drift at a roof step</title><desc>Elevation of a low roof next to a taller roof 2.44 m higher, drawn to one scale. The balanced snow on the lower roof is 1.01 kN/m2, 0.36 m deep. The leeward drift is a triangle 0.97 m high and 3.87 m wide against the step; its surcharge is 2.72 kN/m2 at the wall, so the peak snow load there is 77.8 psf = 3.72 kN/m2.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Drift on the lower roof (ASCE 7-22, computed in ft, shown in m)</text>
