<text class="ts" x="442.0" y="101.0" text-anchor="start">  (dashed lines, halfway to the</text>
<text class="ts" x="442.0" y="118.0" text-anchor="start">  next beams)</text>
<text class="ts" x="442.0" y="135.0" text-anchor="start">Office both sides:</text>
