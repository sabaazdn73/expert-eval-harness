.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Rain load with the primary drain blocked</title><desc>Section of a flat roof with a blocked primary drain and a secondary overflow inlet 75 mm above the roof. The design water level is the static head to the inlet, ds = 75 mm, plus the hydraulic head over it, dh = 25 mm, plus the ponding head of the deflected roof, dp = 15 mm. R = 0.0098 x 115 = 1.13 kN/m2.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Roof section near the drains (not to scale)</text>
