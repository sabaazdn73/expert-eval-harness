.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Portal method against the frame model</title><desc>Three bays of 9 m, two storeys of 3.75 m, fixed bases, 100 kN at the roof and 60 kN at level 1. The portal method gives bottom-storey column shears of 26.7 and 53.3 kN and base moments of 50 and 100 kN·m. The model (cracked stiffness) gives 37.0 and 44.0 kN and base moments of 104.1 and 112.1 kN·m: the inflection points sit at 0.68 to 0.75 of the storey height above the base, not at mid-height.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="500" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Portal method against the model: bottom storey</text>
