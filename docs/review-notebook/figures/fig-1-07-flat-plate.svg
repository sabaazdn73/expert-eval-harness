.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Flat plate: load goes from slab straight into the column</title><desc>Plan of a flat plate on a 7.5 m grid. Column strips 3.75 m wide along the column lines, middle strips between them. The interior column takes 56.25 square metres; the punching critical section at d/2 from the 500 mm column has a perimeter of 2.84 m.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><rect x="40.0" y="40.0" width="390.0" height="390.0" rx="0" stroke-width="0.5" class="c-gray" opacity="0.5"/>
