.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Support settlement in a continuous beam</title><desc>Two 9 m spans, 400 by 600 girder. The middle support settles 15 mm: a sagging moment of 36.0 kN·m over B with cracked stiffness, 103.0 with gross stiffness. Combined with gravity (415.3 kN·m hogging) the hogging over B falls to 379.3 and the span moment rises from 233.6 to 247.3 kN·m.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Middle support settles 15 mm (girder 400 × 600, 2 × 9 m)</text>
