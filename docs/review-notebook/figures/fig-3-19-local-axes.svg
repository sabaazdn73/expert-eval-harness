<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><style>text{font-family:"DejaVu Sans",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.tl{font-size:12px;fill:#2C2C2A}.tt{font-size:15px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-coral{fill:#FAECE7;stroke:#993C1D}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Local axes: a column turned 90 degrees</title><desc>One-bay portal with 300 by 700 columns under 100 kN. Strong axis in the plane of the frame: drift 3.54 mm, base moment 140.8 kN·m. Turned 90 degrees by a wrong local axis: I falls by 5.44 times, drift 11.24 mm (3.2 times), and the beam takes more of the moment.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">300 × 700 columns: strong axis against weak axis in the frame plane</text>
<text class="th" x="115.0" y="80.0" text-anchor="middle">Strong axis in plane</text>
<rect x="80.0" y="100.0" width="70.0" height="30.0" rx="0" stroke-width="0.8" class="c-gray"/>
<line x1="65.0" y1="115.0" x2="76.0" y2="115.0" stroke="#D85A30" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="ts" x="115.0" y="190.0" text-anchor="middle">frame plane →</text>
<text class="th" x="115.0" y="230.0" text-anchor="middle" style="fill:#0F6E56">drift 3.54 mm</text>
<text class="th" x="315.0" y="80.0" text-anchor="middle">Turned 90°</text>
<rect x="300.0" y="100.0" width="30.0" height="70.0" rx="0" stroke-width="0.8" class="c-gray"/>
<line x1="265.0" y1="135.0" x2="296.0" y2="135.0" stroke="#D85A30" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="ts" x="315.0" y="190.0" text-anchor="middle">frame plane →</text>
<text class="th" x="315.0" y="230.0" text-anchor="middle" style="fill:#993C1D">drift 11.24 mm</text>
<text class="ts" x="30.0" y="116.0" text-anchor="start">load</text>
<rect x="450.0" y="60.0" width="220.0" height="190.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="462.0" y="84.0" text-anchor="start">I strong 8575 × 10⁻⁶ m⁴</text>
<text class="ts" x="462.0" y="102.0" text-anchor="start">I weak 1575 × 10⁻⁶ m⁴</text>
<text class="ts" x="462.0" y="120.0" text-anchor="start">  ratio (0.7/0.3)² = 5.44</text>
<text class="ts" x="462.0" y="138.0" text-anchor="start"></text>
<text class="ts" x="462.0" y="156.0" text-anchor="start">Drift ×3.17</text>
<text class="ts" x="462.0" y="174.0" text-anchor="start">Base M 140.8 → 108.0</text>
<text class="ts" x="462.0" y="192.0" text-anchor="start">Top M 48.2 → 79.9</text>
<text class="ts" x="462.0" y="210.0" text-anchor="start">(the beam restrains more)</text>
<rect x="30.0" y="272.0" width="640.0" height="130.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="294.0" text-anchor="start">Each program defines member local axes its own way (2 and 3, or y and z). A section can be</text>
<text class="ts" x="42.0" y="313.0" text-anchor="start">  assigned with b and h swapped, or a column rotated when drawn. The model still solves.</text>
<text class="ts" x="42.0" y="332.0" text-anchor="start">Check: section orientation in plan against the drawings; the first mode period and</text>
<text class="ts" x="42.0" y="351.0" text-anchor="start">  direction against a hand estimate; column moments about each axis against the frame.</text>
<text class="ts" x="42.0" y="370.0" text-anchor="start">Walls and blade columns are the most sensitive: here ×5.4 on I and ×3.2 on drift.</text></svg>