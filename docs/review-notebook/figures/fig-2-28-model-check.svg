<text class="ts" x="52.0" y="262.0" text-anchor="start">Hand D = 3 × 972 × 8.862 + 972 × 8.292 + 4 × (468.8 + 378.0) + 150 = 37,437 kN</text>
<text class="ts" x="52.0" y="282.0" text-anchor="start">Model D 31,401: 3 × 972 × 2.07 = 6,036 kN of screed, finishes and ceiling</text>
<text class="ts" x="52.0" y="302.0" text-anchor="start">  sit in a case &quot;SD&quot; that no combination uses. Ratio 0.839: stop and fix.</text>
<text class="ts" x="52.0" y="322.0" text-anchor="start">Model L: 145,800 / 6,998 = 20.8 = 50 / 2.40: 50 psf typed into a kN/m² field.</text>
<text class="ts" x="52.0" y="342.0" text-anchor="start">Snow: 39.1 / 816.5 = 0.048 ≈ 0.04788: a kN/m² value typed into a psf field.</text>
<text class="ts" x="52.0" y="362.0" text-anchor="start">Also: self-weight counted once; seismic mass = D + 0.48 partitions, no full L;</text>
<text class="ts" x="52.0" y="382.0" text-anchor="start">  every load in a case that the combinations actually use.</text></svg>