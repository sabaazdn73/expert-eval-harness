<text class="ts" x="52.0" y="402.0" text-anchor="start">ΔL = 10 × 10⁻⁶ × 25 × 60,000 = 15 mm; each end moves 7.5 mm toward the middle.</text>
<text class="ts" x="52.0" y="420.0" text-anchor="start">k = 12EI/h³ = 35.6 kN/mm uncracked, 17.8 cracked (assumed);  V = 17.8 × 7.5 = 133 kN</text>
<text class="ts" x="52.0" y="438.0" text-anchor="start">M = V h/2 = 250 kN·m per end column: an upper bound (fixed-fixed, rigid floor, no creep).</text></svg>