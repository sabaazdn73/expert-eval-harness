<text class="ts" x="255.0" y="414.0" text-anchor="middle"></text>
<text class="ts" x="46.0" y="220.0" text-anchor="middle" transform="rotate(-90 46.0 220.0)">kN/m²</text>
<rect x="122.5" y="188.0" width="100.0" height="192.0" rx="2" stroke-width="1" fill="#B5D4F4" stroke="#185FA5"/>
<text class="th" x="172.5" y="180.0" text-anchor="middle">0.84</text>
<text class="ts" x="172.5" y="400.0" text-anchor="middle">pf = 0.7 Ce Ct pg</text>
<rect x="287.5" y="105.7" width="100.0" height="274.3" rx="2" stroke-width="1" fill="#C0DD97" stroke="#3B6D11"/>
<text class="th" x="337.5" y="97.7" text-anchor="middle">1.20</text>
<text class="ts" x="337.5" y="400.0" text-anchor="middle">pm = pg (pg ≤ 1.44)</text>
<rect x="440.0" y="60.0" width="228.0" height="330.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="452.0" y="84.0" text-anchor="start">ASCE 7-22 7.3</text>
<text class="ts" x="452.0" y="101.0" text-anchor="start">pf = 0.7 × 1 × 1 × 1.20 = 0.84</text>
<text class="ts" x="452.0" y="118.0" text-anchor="start"></text>
<text class="ts" x="452.0" y="135.0" text-anchor="start">7.3.3, low-slope roofs:</text>
<text class="ts" x="452.0" y="152.0" text-anchor="start">  pm = pg = 1.20 when</text>
<text class="ts" x="452.0" y="169.0" text-anchor="start">  pg ≤ pm,max (1.44, RC II)</text>
<text class="ts" x="452.0" y="186.0" text-anchor="start">  a separate uniform case,</text>
<text class="ts" x="452.0" y="203.0" text-anchor="start">  not combined with drift,</text>
<text class="ts" x="452.0" y="220.0" text-anchor="start">  sliding or unbalanced loads</text>
<text class="ts" x="452.0" y="237.0" text-anchor="start"></text>
<text class="ts" x="452.0" y="254.0" text-anchor="start">In 7-22, pg already depends on</text>
<text class="ts" x="452.0" y="271.0" text-anchor="start">the Risk Category: no Is.</text>
<text class="ts" x="452.0" y="288.0" text-anchor="start">ASCE 7-16 Is for snow (Table 1.5-2):</text>
<text class="ts" x="452.0" y="305.0" text-anchor="start">  0.8 / 1.0 / 1.1 / 1.2</text>
<text class="ts" x="452.0" y="322.0" text-anchor="start"></text>
<text class="ts" x="452.0" y="339.0" text-anchor="start">EN 1991-1-3: s = μ1 Ce Ct sk,</text>
<text class="ts" x="452.0" y="356.0" text-anchor="start">  μ1 = 0.8 for a flat roof</text></svg>