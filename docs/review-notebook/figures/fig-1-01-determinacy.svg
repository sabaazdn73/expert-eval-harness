<line x1="380.0" y1="364.0" x2="420.0" y2="364.0" stroke="#73726c" stroke-width="1" stroke-linecap="butt"/>
<polygon points="520.0,340.0 508.0,355.0 532.0,355.0" stroke-width="1" fill="none" stroke="#73726c"/>
<circle cx="514.0" cy="359.0" r="3.5" fill="none" stroke="#73726c" stroke-width="1"/>
