.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Bridge deck to girders: lever rule for the exterior girder</title><desc>Cross-section of a girder bridge with girders at 2.5 m. The barrier face is 0.7 m outside the exterior girder; the first wheel is 0.6 m from the barrier face, the second 1.8 m further. Treating the deck as simply supported between the exterior and first interior girder, the exterior girder takes 0.68 of a lane, 0.816 with the one-lane multiple presence factor of 1.2.</desc><defs><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/><rect x="80.0" y="150.0" width="570.0" height="18.0" rx="0" stroke-width="1" class="c-gray"/>
