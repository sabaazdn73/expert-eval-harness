.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Influence lines for a two-span runway girder</title><desc>Influence lines for the middle reaction RB and the moment over B of two 9 m spans. Two wheels of 112.5 kN at 3.6 m: RB is largest, 212.4 kN, with the wheels at 7.2 and 10.8 m, against 180.0 kN if the spans are treated as simple. The hogging moment over B is largest, 160.9 kN·m, with both wheels in one span near 0.58L.</desc><defs><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/><text class="tt" x="20.0" y="28.0" text-anchor="start">Unit load moving across two 9 m spans (Müller-Breslau)</text>
