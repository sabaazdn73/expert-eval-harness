<text class="ts" x="482.0" y="84.0" text-anchor="start">Centreline model:</text>
<text class="ts" x="482.0" y="101.0" text-anchor="start">  M face = M − V·c/2 + w(c/2)²/2</text>
<text class="ts" x="482.0" y="118.0" text-anchor="start">  = 358.9 (−13.6%)</text>
<text class="ts" x="482.0" y="135.0" text-anchor="start">ACI 318-19 9.4.2.1: Mu at the</text>
<text class="ts" x="482.0" y="152.0" text-anchor="start">  face permitted (monolithic)</text>
<text class="ts" x="482.0" y="169.0" text-anchor="start"></text>
<text class="ts" x="482.0" y="186.0" text-anchor="start">EN 1992-1-1 5.3.2.2:</text>
<text class="ts" x="482.0" y="203.0" text-anchor="start">  (3) monolithic: face,</text>
<text class="ts" x="482.0" y="220.0" text-anchor="start">  ≥ 0.65 × FEM = 180.0</text>
<text class="ts" x="482.0" y="237.0" text-anchor="start">  (4) no rotational restraint:</text>
<text class="ts" x="482.0" y="254.0" text-anchor="start">  ΔM = F·t/8 = 28.8</text>
<text class="ts" x="482.0" y="271.0" text-anchor="start"></text>
<text class="ts" x="482.0" y="288.0" text-anchor="start">Rigid zones (ACI 6.6.2.3(b))</text>
<text class="ts" x="482.0" y="305.0" text-anchor="start">  change the result: +9%</text>
