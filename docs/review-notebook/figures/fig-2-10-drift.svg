<rect x="30.0" y="340.0" width="638.0" height="122.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="360.0" text-anchor="start">γ = 0.13 × 30 + 14 = 17.9 pcf (2.81 kN/m³);  W2 = 0.45 (assumed; the ASCE hazard tool in practice)</text>
<text class="ts" x="42.0" y="378.0" text-anchor="start">hd = 1.5 √(30^0.74 × 100^0.70 × 0.45^1.7 / 17.9) = 3.17 ft = 0.97 m  (≤ 0.6 × 60 ft)</text>
<text class="ts" x="42.0" y="396.0" text-anchor="start">windward drift: 0.75 × 2.65 = 1.99 ft (smaller);  hb = 21/17.9 = 1.17 ft</text>
<text class="ts" x="42.0" y="414.0" text-anchor="start">hc = 8 − 1.17 = 6.83 ft &gt; hd, so w = 4hd = 12.7 ft = 3.87 m</text>
<text class="ts" x="42.0" y="432.0" text-anchor="start">pd = hd γ = 56.8 psf = 2.72 kN/m²;  peak 21 + 56.8 = 77.8 psf = 3.72 kN/m²</text>
<text class="ts" x="42.0" y="450.0" text-anchor="start">Drift sits on top of the balanced snow, never on the pm minimum.</text></svg>