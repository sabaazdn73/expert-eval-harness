<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img"><style>text{font-family:"DejaVu Sans",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.tl{font-size:12px;fill:#2C2C2A}.tt{font-size:15px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F2;stroke:#B4B2A9}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-coral{fill:#FAECE7;stroke:#993C1D}
.halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-white{fill:#FFFFFF;stroke:#5F5E5A}</style><title>Discontinued shear wall with an in-plane offset</title><desc>Elevation: a 6 m shear wall above level 2 stops on a transfer beam; the wall below is shifted 6 m along the same line, centre to centre. The storey shear of 600 kN passes through the level 2 diaphragm and collectors to the lower wall, and the 4800 kN m overturning moment arrives on the transfer beam as a couple of about 888.9 kN at the boundary elements, 5.4 m apart.</desc><defs><marker id="m534AB7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m73726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m854F0B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m993C1D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/><rect x="330.0" y="60.0" width="150.0" height="190.0" rx="0" stroke-width="1" class="c-purple"/>
<text class="tl" x="405.0" y="150.0" text-anchor="middle">wall above</text>
<line x1="60.0" y1="250.0" x2="640.0" y2="250.0" stroke="#2C2C2A" stroke-width="5" stroke-linecap="butt"/>
<text class="ts" x="636.0" y="242.0" text-anchor="end">level 2 diaphragm</text>
<rect x="326.0" y="254.0" width="158.0" height="30.0" rx="0" stroke-width="1" class="c-coral"/>
<text class="tl" x="405.0" y="274.0" text-anchor="middle">transfer beam</text>
<rect x="468.0" y="284.0" width="16.0" height="150.0" rx="0" stroke-width="1" class="c-gray"/>
<rect x="180.0" y="254.0" width="150.0" height="180.0" rx="0" stroke-width="1" class="c-purple"/>
<text class="tl" x="255.0" y="350.0" text-anchor="middle">wall below</text>
<line x1="556.0" y1="90.0" x2="486.0" y2="90.0" stroke="#D85A30" stroke-width="2" stroke-linecap="butt" marker-end="url(#mD85A30)"/>
<text class="th" x="520.0" y="112.0" text-anchor="middle">storey shear</text>
<text class="th" x="520.0" y="128.0" text-anchor="middle">600 kN</text>
<line x1="324.0" y1="238.0" x2="260.0" y2="238.0" stroke="#854F0B" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#m854F0B)"/>
<text class="th" x="60.0" y="230.0" text-anchor="start">diaphragm + collector: 600 kN</text>
<line x1="337.0" y1="200.0" x2="337.0" y2="246.0" stroke="#534AB7" stroke-width="2" stroke-linecap="butt" marker-end="url(#m534AB7)"/>
<text class="th" x="332.0" y="196.0" text-anchor="end">C 888.9</text>
<line x1="473.0" y1="246.0" x2="473.0" y2="200.0" stroke="#993C1D" stroke-width="2" stroke-linecap="butt" marker-end="url(#m993C1D)"/>
<text class="th" x="478.0" y="196.0" text-anchor="start">T 888.9</text>
<line x1="339.0" y1="44.0" x2="471.0" y2="44.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="337.0" y1="39.0" x2="337.0" y2="49.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="473.0" y1="39.0" x2="473.0" y2="49.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="405.0" y="39.0" text-anchor="middle">5.4 m</text>
<line x1="257.0" y1="456.0" x2="403.0" y2="456.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt" marker-end="url(#m73726c)" marker-start="url(#m73726c)"/>
<line x1="255.0" y1="451.0" x2="255.0" y2="461.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<line x1="405.0" y1="451.0" x2="405.0" y2="461.0" stroke="#73726c" stroke-width="0.6" stroke-linecap="butt"/>
<text class="ts" x="330.0" y="451.0" text-anchor="middle">offset 6 m, centre to centre</text>
<rect x="500.0" y="300.0" width="170.0" height="150.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="510.0" y="322.0" text-anchor="start">M at level 2</text>
<text class="ts" x="510.0" y="340.0" text-anchor="start">= 4800 kN·m</text>
<text class="ts" x="510.0" y="358.0" text-anchor="start">C = T = 4800 / 5.4</text>
<text class="ts" x="510.0" y="376.0" text-anchor="start">= 888.9 kN</text>
<text class="ts" x="510.0" y="394.0" text-anchor="start">Supporting members:</text>
<text class="ts" x="510.0" y="412.0" text-anchor="start">overstrength forces</text>
<text class="ts" x="510.0" y="430.0" text-anchor="start">(ASCE 7 12.3.3.3).</text></svg>