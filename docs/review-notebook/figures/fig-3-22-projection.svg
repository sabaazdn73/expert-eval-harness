<text class="ts" x="422.0" y="250.0" text-anchor="start">  member: 34.6 kN</text>
<text class="ts" x="422.0" y="267.0" text-anchor="start">  as 3 per m on plan: 30.0 kN</text>
<text class="ts" x="422.0" y="284.0" text-anchor="start">  (−13.4%)</text>
<rect x="30.0" y="360.0" width="640.0" height="104.0" rx="8" stroke-width="0.6" class="box"/>
<text class="ts" x="42.0" y="382.0" text-anchor="start">Snow, roof live load and rain are per area on plan; self-weight and cladding per length</text>
<text class="ts" x="42.0" y="401.0" text-anchor="start">  along the member. Programs offer global, projected and local directions.</text>
<text class="ts" x="42.0" y="420.0" text-anchor="start">Check: total vertical reaction against the plan load. At 45° the error is 41.4%.</text>
<text class="ts" x="42.0" y="439.0" text-anchor="start">Wind acts normal to the surface: local direction, per sloping length.</text></svg>